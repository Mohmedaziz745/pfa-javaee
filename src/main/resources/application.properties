spring.application.name=shopflw
server.port=8081

spring.datasource.url=jdbc:h2:mem:shopflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui

app.jwt.access-token-expiration-minutes=30
app.jwt.refresh-token-expiration-days=7
app.jwt.secret=shopflow-super-secret-key-shopflow-super-secret-key-2026
